workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
test:
  parallel:
    matrix:
      - GCC_VERSION:
          - 12.5.0
          - 13.4.0
          - 14.3.0
          - 15.2.0
  image: gcc:${GCC_VERSION}
  script:
    - apt-get update
    - apt-get install -y cmake
    - cmake -B "${CI_BUILDS_DIR}" -DCMAKE_BUILD_TYPE=Release
    - cmake --build "${CI_BUILDS_DIR}" --config Release
    - cd "${CI_BUILDS_DIR}"
    - ctest -C "${CI_BUILDS_DIR}" Release
